name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8080
      EXPECTED_RELEASE: devops6-babenko
      CHECK_TIMEOUT: "5"
      IMAGE: devops6-babenko
      CONTAINER: devops6-web

    steps:
      - name: Отримати файли репозиторію
        uses: actions/checkout@v5

      - name: Підготувати Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Встановити залежності
        run: python -m pip install -r requirements.txt

      - name: Зібрати Docker-образ
        run: docker build -t "$IMAGE" .

      - name: Запустити контейнер
        run: docker run -d --name "$CONTAINER" -p 127.0.0.1:8080:80 "$IMAGE"

      - name: Дочекатися відповіді сервісу (не довше 30 с)
        run: |
          timeout 30 bash -c 'until curl --silent --fail --max-time 2 "$BASE_URL/" > /dev/null; do sleep 1; done'
          echo "Сервіс відповідає"

      - name: Тести (infra + HTTP + скрипт)
        run: |
          mkdir -p reports
          python -m pytest -v --hosts="docker://$CONTAINER" --junitxml=reports/pytest.xml

      - name: Команда перевірки сервісу
        run: python check_service.py

      - name: Готовність підтверджено
        run: echo "Готовність підтверджено для коміту $GITHUB_SHA"

      - name: Зберегти журнали контейнера
        if: always()
        run: |
          mkdir -p reports
          docker logs "$CONTAINER" > reports/container.log 2>&1 || echo "контейнер не знайдено" > reports/container.log

      - name: Завантажити результати
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: reports/

      - name: Видалити тестовий контейнер
        if: always()
        run: docker rm -f "$CONTAINER" || true
